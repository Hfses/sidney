name: Build Android APK

# Gera o APK Android automaticamente pelo GitHub, sem precisar instalar
# nada no computador. Basta subir este projeto para um repositório no
# GitHub — o workflow roda sozinho e disponibiliza o .apk para download.

on:
  workflow_dispatch: {}
  push:
    branches: [main, master, calculadora-de-bobinas]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java (necessário para o Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes unitários (calculateCoil)
        run: npx jest

      - name: Gerar projeto Android nativo (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Gerar bundle JavaScript para o APK
        run: |
          mkdir -p android/app/src/main/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Dar permissão de execução ao gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK (debug — instalável direto no celular)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-de-bobinas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

